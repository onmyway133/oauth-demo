<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profile — OAuth Demo</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f0f2f5; margin: 0; }
    .card { background: white; padding: 2.5rem; border-radius: 10px; box-shadow: 0 2px 16px rgba(0,0,0,.1); width: 380px; text-align: center; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; background: #0066ff; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; margin: 0 auto 1rem; }
    h2 { margin: 0 0 .3rem; font-size: 1.3rem; }
    .email { color: #666; font-size: .9rem; margin-bottom: 1.5rem; }
    .badge { display: inline-block; background: #e8f0fe; color: #0066ff; padding: 3px 10px; border-radius: 12px; font-size: .8rem; }
    .logout-btn { display: inline-block; margin-top: 1.5rem; padding: 10px 24px; background: #f44; color: white; border-radius: 6px; text-decoration: none; font-size: .95rem; }
    .logout-btn:hover { background: #c00; }
    #error { color: red; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar" id="avatar">?</div>
    <h2 id="name">Loading...</h2>
    <div class="email" id="email"></div>
    <div><span class="badge" id="username"></span></div>
    <p id="error" style="display:none"></p>
    <a class="logout-btn" href="/logout">Logout</a>
  </div>
  <script>
    fetch("/user")
      .then(r => r.json())
      .then(user => {
        if (user.error) {
          document.getElementById("error").textContent = "Session expired. Please login again."
          document.getElementById("error").style.display = "block"
          document.getElementById("name").textContent = ""
          setTimeout(() => location.href = "/", 2000)
          return
        }
        document.getElementById("avatar").textContent = user.name[0].toUpperCase()
        document.getElementById("name").textContent = user.name
        document.getElementById("email").textContent = user.email
        document.getElementById("username").textContent = "@" + user.username
      })
      .catch(() => location.href = "/")
  </script>
</body>
</html>
